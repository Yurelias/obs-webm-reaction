name: Build OBS WebM Reaction Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # permet de lancer manuellement depuis l'interface GitHub

jobs:
  build-windows:
    name: Build Windows DLL
    runs-on: windows-2022

    steps:
      # 1. Récupère le code du repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installe OBS Studio + headers via le package officiel
      - name: Install OBS Studio (with dev headers)
        run: |
          $version = "31.0.3"
          $url = "https://github.com/obsproject/obs-studio/releases/download/$version/OBS-Studio-$version-Windows.zip"
          Invoke-WebRequest -Uri $url -OutFile obs.zip
          Expand-Archive -Path obs.zip -DestinationPath C:\obs-studio
        shell: powershell

      # 3. Clone les headers libobs depuis les sources OBS (nécessaire pour compiler)
      - name: Clone OBS source headers
        run: |
          git clone --depth=1 --branch 31.0.3 https://github.com/obsproject/obs-studio.git C:\obs-src
        shell: cmd

      # 4. Configure avec CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . ^
            -DLIBOBS_INCLUDE_DIR="C:/obs-src/libobs" ^
            -DLIBOBS_LIB="C:/obs-studio/bin/64bit/obs.dll" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -A x64
        shell: cmd

      # 5. Compile
      - name: Build
        run: cmake --build build --config Release
        shell: cmd

      # 6. Prépare les fichiers à télécharger
      - name: Prepare artifact folders
        run: |
          mkdir output\obs-plugins\64bit
          mkdir output\data\obs-plugins\webm-reaction\locale
          copy build\Release\webm-reaction.dll output\obs-plugins\64bit\
          xcopy /E /I data output\data\obs-plugins\webm-reaction
        shell: cmd

      # 7. Upload l'artifact (fichier téléchargeable depuis GitHub)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-webm-reaction-windows
          path: output\
          retention-days: 30
