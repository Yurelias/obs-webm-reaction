name: Build OBS WebM Reaction Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows DLL
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup cmake
        uses: lukka/get-cmake@latest

      - name: Clone OBS source
        run: git clone --depth=1 --branch 31.0.3 https://github.com/obsproject/obs-studio.git C:\obs-src
        shell: cmd

      - name: Configure OBS
        run: |
          cmake -B C:\obs-build -S C:\obs-src ^
            -A x64 ^
            -DENABLE_PLUGINS=OFF ^
            -DENABLE_UI=OFF ^
            -DENABLE_SCRIPTING=OFF ^
            -DCMAKE_BUILD_TYPE=Release
        shell: cmd

      - name: Build libobs only
        run: cmake --build C:\obs-build --config Release --target libobs
        shell: cmd

      - name: Configure plugin
        run: |
          cmake -B build -S . ^
            -A x64 ^
            -DLIBOBS_INCLUDE_DIR="C:/obs-src/libobs" ^
            -DLIBOBS_LIB="C:/obs-build/libobs/Release/obs.lib"
        shell: cmd

      - name: Build plugin
        run: cmake --build build --config Release
        shell: cmd

      - name: Prepare artifact
        run: |
          mkdir output\obs-plugins\64bit
          mkdir output\data\obs-plugins\webm-reaction\locale
          copy build\Release\webm-reaction.dll output\obs-plugins\64bit\
          xcopy /E /I data output\data\obs-plugins\webm-reaction
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-webm-reaction-windows
          path: output\
          retention-days: 30
