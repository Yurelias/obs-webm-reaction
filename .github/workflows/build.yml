name: Build OBS WebM Reaction Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows DLL
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone OBS source headers
        run: git clone --depth=1 --branch 31.0.3 https://github.com/obsproject/obs-studio.git C:\obs-src
        shell: cmd

      - name: Download OBS deps (import lib)
        run: |
          curl -L -o obs-deps.zip https://github.com/obsproject/obs-studio/releases/download/31.0.3/OBS-Studio-31.0.3-Windows.zip
          7z x obs-deps.zip -oC:\obs-studio
        shell: cmd

      - name: Configure CMake
        run: |
          cmake -B build -S . ^
            -DLIBOBS_INCLUDE_DIR="C:/obs-src/libobs" ^
            -DLIBOBS_LIB="C:/obs-studio/bin/64bit/obs.lib" ^
            -A x64
        shell: cmd

      - name: Build
        run: cmake --build build --config Release
        shell: cmd

      - name: Prepare artifact
        run: |
          mkdir output\obs-plugins\64bit
          mkdir output\data\obs-plugins\webm-reaction\locale
          copy build\Release\webm-reaction.dll output\obs-plugins\64bit\
          xcopy /E /I data output\data\obs-plugins\webm-reaction
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-webm-reaction-windows
          path: output\
          retention-days: 30
